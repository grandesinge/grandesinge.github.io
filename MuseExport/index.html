     <img class="grpelem" id="u10946-20" alt="« z'auriez pas vu mon humanité ? » Ce projet musical, c'est une quête de lien, de joie collective, de similitudes ou de différences... mieux ! de partage. Mais là, ici, comment ? Il faudrait bien un regard de grande singe pour tenter d'y voir plus clair. Il faudrait bien un peu d'animalité pour (re)trouver de l'humain, un peu de recul velu pour penser différemment. Peut-on enfin être ensemble et de tous poils sur le même dance-floor ? Alors elle balance le beat, grande singe, elle pousse les sons, pour libérer les bêtes. " width="1017" height="256" src="images/u10946-20.png?crc=4076402316" data-IBE-flags="txtStyleSrc"/><!-- rasterized frame -->
