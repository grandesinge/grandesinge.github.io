   <img class="grpelem" id="u10946-25" alt="Ce projet musical est né d'une quête de lien et de joie collective. Il faudrait bien un regard de grande singe pour tenter d'y voir clair. Il faudrait bien un peu d'animalité pour trouver de l'humain, Il faudrait bien un peu de recul velu pour penser différemment les normes sociales. grande singe observe et ressent. Elle nous dépeint tout brut, sans jugement. Entre hominoïdes*, des singes sans queue, quoi. Elle balance le beat, grande singe, elle pousse les sons, pour libérer les bêtes." width="932" height="218" src="images/u10946-25.png?crc=197262563" data-IBE-flags="txtStyleSrc"/><!-- rasterized frame -->

   <img class="grpelem" id="u11029-11" alt="*Hominoïde = singe sans queue = grand singe En primatologie, l'expression &quot;grands singes&quot; dénomme l'ensemble des singes sans queue : les gibbons, les orang-outans, les gorilles, les chimpanzés, les bonobos et les humains. Ils constituent la super-famille des Hominoïdes (en anglais : &quot;APE&quot;). La seconde super-famille de singes est celle des singes à queue ou Cercopithécoïdes (en anglais : &quot;monkey&quot;)." width="908" height="129" src="images/u11029-11.png?crc=424804955" data-IBE-flags="txtStyleSrc"/><!-- rasterized frame -->
