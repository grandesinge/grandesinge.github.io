   <img class="grpelem" id="u10946-32" alt="Ce projet musical est né d'une quête de lien, de joie collective, de similitudes et différences. Mais là, ici, comment partager ? Il faudrait bien un regard de grande singe pour tenter d'y voir plus clair. Il faudrait bien un peu d'animalité pour trouver de l'humain, Il faudrait bien un peu de recul velu pour penser différemment loin des normes sociales. grande singe nous observe et ressent. Elle nous dépeint tout brut, sans jugement. Entre hominoïdes, des singes sans queue, quoi. Peut-on enfin être ensemble et de tous poils sur le même dance-floor ? Alors elle balance le beat, grande singe, elle pousse les sons, pour libérer les bêtes. " width="1000" height="273" src="images/u10946-32.png?crc=3917825367" data-IBE-flags="txtStyleSrc"/><!-- rasterized frame -->

   <img class="grpelem" id="u11029-9" alt="*Hominoïde = singe sans queue = grand singe En primatologie, l'expression &quot;grands singes&quot; dénomme l'ensemble des singes sans queue : les gibbons, les orang-outans, les gorilles, les chimpanzés, les bonobos et les humains. Ils constituent la super-famille des Hominoïdes (en anglais : &quot;APE&quot;). La seconde super-famille de singes est celle des singes à queue ou Cercopithécoïdes (en anglais : &quot;monkey&quot;)." width="975" height="129" src="images/u11029-9.png?crc=3942510475" data-IBE-flags="txtStyleSrc"/><!-- rasterized frame -->
